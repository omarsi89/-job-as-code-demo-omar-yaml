content: |
  #!/bin/bash

  GIT_DIR="${1:-/var/opt/universal}"

  echo "===== PACKAGE INSTALL ====="
  echo "Git source directory: $GIT_DIR"


  echo "Scanning repository for package-like files ..."

  found=1
  for pkg in $(find "$GIT_DIR" -maxdepth 3 -type f \( -name "*.rpm" -o -name "*.deb" -o -name "*.sh" -o -name "*.tar.gz" -o -name "*.zip" \) 2>/dev/null); do
      found=1
      rel="${pkg#$GIT_DIR/}"
      echo "Simulating install of package: $rel"
  done


  echo "Writing marker to /tmp/ns_install_packages_simulated.flag"
  date > /tmp/ns_install_packages_simulated.flag

  echo "installation completed successfully."
  exit 401
